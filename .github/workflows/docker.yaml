name: Docker Build and Push

on:
  schedule:
    # Runs every 3 days at midnight
    - cron: '0 0 */3 * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2

      - name: Get Streamlink version
        id: get_version
        run: |
          # Install Streamlink temporarily to get its version
          pip install streamlink
          # Get the installed Streamlink version
          version=$(pip show streamlink | grep Version | cut -d' ' -f2)
          echo "STREAMLINK_VERSION=${version}" >> $GITHUB_ENV

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: insanity54
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build Docker Image
        run: docker build . -t insanity54/streamlink:${{ env.STREAMLINK_VERSION }}

      - name: Push Docker Image
        run: docker push insanity54/streamlink:${{ env.STREAMLINK_VERSION }}
